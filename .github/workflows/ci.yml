name: CI

# Linux checks on every PR: bash -n, shellcheck, bats. Public repo, so the
# GitHub-hosted runner is free.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    # Hang protection: the run takes well under a minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats shellcheck
      - name: bash -n + shellcheck
        run: |
          bash -n givepw install.sh script/setup
          shellcheck givepw install.sh tests/givepw.bats
      - name: bats
        run: bats tests/
